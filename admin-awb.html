    // One-Tap Copy function with fallback support for mobile browsers / WebView
    async function copyFullCode() {
      const copyBtn = document.getElementById('copy-btn');
      const copyIcon = document.getElementById('copy-icon');
      const copyText = document.getElementById('copy-text');
      const toast = document.getElementById('toast');

      let copied = false;

      // Primary clipboard API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(fullCode);
          copied = true;
        } catch (err) {
          copied = false;
        }
      }

      // Robust fallback for mobile WebViews / permissions block
      if (!copied) {
        const textArea = document.getElementById('hidden-code-source');
        textArea.select();
        textArea.setSelectionRange(0, 9999999);
        try {
          copied = document.execCommand('copy');
        } catch (err) {
          copied = false;
        }
      }

      // Visual feedback
      copyBtn.classList.remove('from-orange-600', 'to-amber-600');
      copyBtn.classList.add('from-emerald-600', 'to-teal-600');
      copyIcon.textContent = 'check';
      copyText.textContent = 'Copied!';

      toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        copyBtn.classList.remove('from-emerald-600', 'to-teal-600');
        copyBtn.classList.add('from-orange-600', 'to-amber-600');
        copyIcon.textContent = 'content_copy';
        copyText.textContent = 'Copy code';
        
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      }, 2500);
    }

    // Direct download helper
    function downloadCode() {
      const blob = new Blob([fullCode], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
